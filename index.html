<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leitor</title>
<style>
:root{--bg:#faf8f5;--fg:#222;--mut:#777;--card:#fff;--ac:#3b6fd4;--bd:#e3dfd8;--hl:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--bg:#17171a;--fg:#eee;--mut:#999;--card:#222226;--ac:#7fa6f5;--bd:#333;--hl:#5a4a10}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
button,select,input[type=text],input[type=password]{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
#txt{max-height:36vh;overflow:auto;font-size:15px}#txt span.on{background:var(--hl);border-radius:3px}
.mut{color:var(--mut);font-size:14px}#out{white-space:pre-wrap}input[type=range]{width:110px}[hidden]{display:none!important}
</style></head><body>
<h1>📖 Leitor</h1>
<div class="card"><input type="file" id="f" accept="application/pdf"><div id="st" class="mut" style="margin-top:6px">Escolha um PDF.</div></div>
<div class="card" id="rd" hidden>
<div class="row"><button id="pv">◀</button><b id="pg">1/1</b><button id="nx">▶</button><button class="p" id="play">▶ Ouvir</button><button id="stop">■</button></div>
<div class="row" style="margin-top:8px"><span class="mut">Vel.</span><input type="range" id="rate" min="0.7" max="2" step="0.1" value="1"><span id="rv" class="mut">1.0x</span><select id="vz" style="max-width:150px"></select></div>
<div id="txt" style="margin-top:10px"></div></div>
<div class="card" id="ai" hidden>
<div class="row"><select id="sc"><option value="page">Esta página</option><option value="all">Documento (início)</option></select></div>
<div class="row" style="margin-top:8px"><button data-k="resumo">Resumo</button><button data-k="resenha">Resenha</button><button data-k="cards">Flashcards</button><button data-k="quiz">Quiz</button></div>
<div class="row" style="margin-top:8px"><input type="text" id="q" placeholder="Pergunte sobre o texto" style="flex:1 1 160px"><button id="ask">Enviar</button></div>
<hr style="border:0;border-top:1px solid var(--bd)"><div id="out" class="mut">As respostas aparecem aqui.</div></div>
<div class="card"><div class="mut">Chave da API Anthropic (para resumo/estudo)</div>
<div class="row" style="margin-top:6px"><input type="password" id="key" placeholder="sk-ant-..." style="flex:1 1 180px"><button id="savek">Salvar</button></div></div>
<script type="module" src="/src/main.js"></script>
</body></html>
